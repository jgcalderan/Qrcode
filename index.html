<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
<meta charset="UTF-8">
 
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>
 
<meta
http-equiv="Cache-Control"
content="no-cache, no-store, must-revalidate"
>
<meta
http-equiv="Pragma"
content="no-cache"
>
<meta
http-equiv="Expires"
content="0"
>
 
<title>Cadeira reservada</title>
</head>
 
<body style="
min-height: 100vh;
margin: 0;
padding: 40px 20px;
box-sizing: border-box;
font-family: Arial, sans-serif;
text-align: center;
background-color: white;
color: #222222;
">
 
<main style="
width: 100%;
max-width: 650px;
margin: 40px auto;
">
 
<h1 style="
margin: 0 0 35px 0;
font-size: 52px;
">
⚠️ Aviso
</h1>
 
<p style="
margin: 25px 0;
font-size: 34px;
line-height: 1.4;
">
Esta cadeira pertence a
</p>
 
<div style="
margin: 30px 0;
font-size: 44px;
font-weight: bold;
">
JOÃO CALDERAN
</div>
 
<p style="
margin: 25px 0;
font-size: 34px;
line-height: 1.4;
">
Deseja assumir o risco de utilizá-la?
</p>
 
<div style="
width: 100%;
margin-top: 60px;
text-align: center;
">
 
<button
type="button"
onclick="assumirRisco()"
style="
display: block;
width: 90%;
max-width: 420px;
height: 110px;
margin: 0 auto 110px auto;
padding: 20px;
border: none;
border-radius: 18px;
background-color: #28a745;
color: white;
font-family: Arial, sans-serif;
font-size: 30px;
font-weight: bold;
cursor: pointer;
"
>
✅ Assumir o risco
</button>
 
<button
type="button"
onclick="naoPreparado()"
style="
display: block;
width: 90%;
max-width: 420px;
height: 110px;
margin: 0 auto;
padding: 20px;
border: none;
border-radius: 18px;
background-color: #dc3545;
color: white;
font-family: Arial, sans-serif;
font-size: 30px;
font-weight: bold;
cursor: pointer;
"
>
❌ Não estou preparado
</button>
 
</div>
 
</main>
 
<script>
function assumirRisco() {
window.location.href =
"https://random.dog/?v=" + Date.now();
}
 
function naoPreparado() {
window.location.href =
"https://cataas.com/cat?v=" + Date.now();
}
</script>
 
</body>
 
</html>
