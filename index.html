<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
<meta charset="UTF-8">
 
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>
 
<!-- Ajuda a evitar versões antigas armazenadas pelo navegador -->
<meta
http-equiv="Cache-Control"
content="no-cache, no-store, must-revalidate"
>
<meta
http-equiv="Pragma"
content="no-cache"
>
<meta
http-equiv="Expires"
content="0"
>
 
<title>Cadeira reservada</title>
</head>
 
<body style="
min-height: 100vh;
margin: 0;
padding: 20px 15px;
box-sizing: border-box;
font-family: Arial, sans-serif;
text-align: center;
background-color: #ffffff;
color: #222222;
">
 
<main style="
width: 100%;
max-width: 480px;
margin: 16px auto;
">
 
<h1 style="
margin: 0 0 20px 0;
font-size: 37px;
">
⚠️ Aviso
</h1>
 
<p style="
margin: 15px 0;
font-size: 24px;
line-height: 1.35;
">
Esta cadeira pertence a
</p>
 
<div style="
margin: 18px 0;
font-size: 32px;
font-weight: bold;
">
JOÃO CALDERAN
</div>
 
<p style="
margin: 15px 0;
font-size: 24px;
line-height: 1.35;
">
Deseja assumir o risco de utilizá-la?
</p>
 
<div style="
width: 100%;
margin-top: 35px;
text-align: center;
">
 
<button
type="button"
onclick="assumirRisco()"
style="
display: block;
width: 86%;
max-width: 330px;
height: 78px;
margin: 0 auto 10px auto;
padding: 12px 16px;
border: none;
border-radius: 13px;
background-color: #28a745;
color: #ffffff;
font-family: Arial, sans-serif;
font-size: 22px;
font-weight: bold;
cursor: pointer;
"
>
✅ Assumir o risco
</button>
 
<button
type="button"
onclick="naoPreparado()"
style="
display: block;
width: 86%;
max-width: 330px;
height: 78px;
margin: 0 auto;
padding: 12px 16px;
border: none;
border-radius: 13px;
background-color: #dc3545;
color: #ffffff;
font-family: Arial, sans-serif;
font-size: 22px;
font-weight: bold;
cursor: pointer;
"
>
❌ Não estou preparado
</button>
 
</div>
 
</main>
 
<script>
function assumirRisco() {
window.location.href =
"https://random.dog/?v=" + Date.now();
}
 
function naoPreparado() {
window.location.href =
"https://cataas.com/cat?v=" + Date.now();
}
</script>
 
</body>
 
</html>
