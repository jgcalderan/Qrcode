<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadeira Reservada</title>
 
<style>
 
body{
font-family: Arial, sans-serif;
text-align:center;
margin-top:15vh;
padding:20px;
}
 
h1{
font-size:48px;
margin-bottom:30px;
}
 
p{
font-size:32px;
line-height:1.5;
}
 
button{
width:320px;
height:90px;
margin:15px;
border:none;
border-radius:16px;
font-size:32px;
font-weight:bold;
color:white;
cursor:pointer;
}
 
.agendar{
background:#28a745;
}
 
.cancelar{
background:#dc3545;
}
 
</style>
</head>
 
<body>
 
<h1>⚠️ Aviso</h1>
 
<p>
Esta cadeira pertence a<br>
<strong>João Calderan</strong>.
</p>
 
<p>
Deseja assumir responsabilidade por ocupá-la?
</p>
 
<button class="agendar" onclick="agendar()">
✅ Agendar
</button>
 
<br>
 
<button class="cancelar" onclick="cancelar()">
❌ Cancelar
</button>
 
<script>
 
function agendar(){
window.location.href = "https://random.dog";
}
 
function cancelar(){
window.location.href = "https://cataas.com/cat";
}
 
</script>
 
</body>
</html>
